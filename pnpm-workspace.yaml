packages:
  - "packages/*"
allowBuilds:
  esbuild: false
  unrs-resolver: false
# Wait until three days after release to install new versions of packages
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@arphi/*"
# Workaround: `eslint-plugin-jsx-a11y` is not yet compatible with ESLint 10
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-jsx-a11y>eslint": "10"
