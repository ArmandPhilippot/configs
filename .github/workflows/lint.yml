name: Lint
permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash

env:
  CI: true
  FORCE_COLOR: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request_target' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ${{ matrix.name }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Types
            script: lint:types
          - name: Scripts
            script: lint:scripts
          - name: Spelling
            script: lint:spelling
          - name: Formatting
            script: lint:formatting
        node-version: [24.21.0]
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Lint
        run: pnpm run ${{ matrix.script }}
